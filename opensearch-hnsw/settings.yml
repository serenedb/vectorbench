# OpenSearch participant: faiss HNSW through the k-NN plugin's knn_vector field.
participant:
  name: OpenSearch HNSW
  system: OpenSearch
  family: hnsw
  tags: [Java, faiss, OpenSearch]

env:
  port: 9200
  container: vectorbench-opensearch-hnsw
  image: opensearchproject/opensearch:3.8.0
  heap: 32g            # OPENSEARCH_JAVA_OPTS -Xms/-Xmx; the rest of RAM is Lucene's page cache
  index_name: items

connection:
  host: 127.0.0.1
  port: 9200
  index_name: items
  timeout: 600
  # Exact kNN is the plugin's knn_score script over the same filter; space_type is filled by load.
  exact_space: l2

# The k-NN plugin names its own query in the profile output. A filtered query that silently fell
# back to a full scan, or an exact row that quietly used the graph, would not carry the same name.
plan_rules:
  approximate: [[KNNQuery, NativeEngineKnnVectorQuery, KnnFloatVectorQuery]]
  exact_not: [KNNQuery, NativeEngineKnnVectorQuery, KnnFloatVectorQuery]

defaults:
  # Matched to the other HNSW participants: m 16, ef_construction 128, 8-bit codes.
  # compression_level 4x is the plugin's byte quantization; 8x/16x/32x are 4-, 2- and 1-bit.
  index: {engine: faiss, m: 16, ef_construction: 128, shards: 1,
          mode: in_memory, compression_level: 4x}
  # ef_search is faiss's beam. The plugin floors it at k, so the k=100 and k=1000 groups need
  # their own ladders.
  ladder: {ef_search: [16, 18, 20, 22, 24, 28, 32, 40, 48, 56, 64, 80, 96, 128, 192, 256, 384]}

datasets:
  sift-128:
    100k: &small
      groups:
        "*/100":  &k100  {ladder: {ef_search: [100, 128, 160, 200, 256, 320, 360, 400, 512, 768]}}
        "*/1000": &k1000 {ladder: {ef_search: [1000, 1200, 1500, 2000, 2500, 3000, 4000]}}
    1m:
      groups: {"*/100": *k100, "*/1000": *k1000}
    10m:
      groups: {"*/100": *k100, "*/1000": *k1000}
  wiki-v3-1024:
    100k: *small
    1m:
      groups: {"*/100": *k100, "*/1000": *k1000}
    10m:
      groups: {"*/100": *k100, "*/1000": *k1000}
