# SereneDB HNSW participant. Scripts are symlinks to ../serenedb-ivf; only this file and queries.sql differ.
participant:
  name: SereneDB HNSW
  system: SereneDB
  family: hnsw
  tags: [C++, SereneDB, Postgres-wire]

env:
  port: 5498
  container: vectorbench-serenedb-hnsw
  image: serenedb/serenedb:26.09.1
  index_kind: hnsw

connection:
  host: 127.0.0.1
  port: 5498
  user: postgres
  dbname: postgres

# EXPLAIN of the first point of every group must contain these, or the group fails (docs/contracts.md section 6).
plan_rules:
  always: [IRESEARCH_SCAN]
  approximate: ["Score:"]
  filtered: [["Index Filter", "Column Filter"]]   # a predicate answered by the term index or by the columnstore, never above the scan
  exact: ["Exact:"]            # exact rows use the engine's brute force (sdb_ann_exact), never the ANN graph or clusters

defaults:
  # Graph parameters match the Qdrant participant's (m 16, ef_construction 128) so the comparison is
  # of the engines, not of two different graphs; quantisation matches too (scalar 8-bit, reranked).
  # segments matches the Qdrant participant's default_segment_number: every
  # engine searches every segment with the full beam and unions the results, so
  # an index of one segment and an index of eight are different amounts of work
  # at the same nominal ef. Pinned on both sides or the row is not a comparison.
  # quant is usq8, not sq8: uniform 8-bit scalar quantization is what Qdrant's
  # ScalarQuantizationConfig does (one quantile for the whole vector), and the
  # rule is that both participants use the same quantization where both support
  # it. Per-dimension sq8 is more accurate but Qdrant has no equivalent, and
  # uniform is also what lets the score run in integers.
  index: {storage: search, relation: items, quant: usq8, m: 16, ef_construction: 128,
          compression: false, segments: 8}
  # ef is the search beam and also the result ceiling (floored at k by SereneDB).
  #
  # rerank sizes the pool re-scored at full precision, as a multiple of k, and is the same knob as the
  # Qdrant participant's `oversample` and Elasticsearch's rescore_vector.oversample: the graph is
  # walked on quantized codes and ceil(rerank * k) of the beam's hits are read back exactly, with the
  # beam widened to hold the pool when the pool is the wider of the two. Both participants sweep 1 and
  # 4, so neither engine reaches a recall by a route the other was not offered -- which was the whole
  # complaint about sweeping our beam against their oversample. 1 re-orders the top k and so cannot
  # change which k come back; it is measured because Qdrant's ladder measures its equivalent, and
  # because the read it pays is real even when the recall it buys is not.
  #
  # mode is how a WHERE is honoured (sdb_hnsw_filter_mode): auto scans a selective predicate's rows or
  # walks the graph scoring every neighbour; bridge crosses rejected rows for one hop only, cheaper at
  # moderate selectivity and weaker at high recall; walk forces the graph walk where auto would scan
  # (a correlated predicate's rows sit where the walk goes). Every mode is offered at every k. At k=10
  # on a selective predicate auto answers exactly and its recall is 1.0 at the cheapest beam, so the
  # ladder has nothing left to trade: bridge is the only point that buys speed with recall the way a
  # competitor's filtered walk does. The frontier picks per row. Only the filtered blocks name {mode},
  # so unfiltered groups measure ef and rerank alone.
  ladder: {ef: [10, 16, 24, 32, 40, 64, 96, 128], oversample: [1.0], mode: [auto]}
  groups:
    "*/100":  {ladder: {ef: [32, 48, 64, 100, 160, 256, 400, 640], oversample: [1.0], mode: [auto]}}
    "*/1000": {ladder: {ef: [160, 256, 400, 640, 1000, 1600], oversample: [1.0], mode: [auto]}}

