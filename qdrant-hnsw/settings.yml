        "corr/100": {ladder: {hnsw_ef: [16, 24, 40], oversample: [1.0]}}
        "eq-0.1/10": {ladder: {hnsw_ef: [10], oversample: [1.0]}}
        "eq-1/10": {ladder: {hnsw_ef: [10], oversample: [1.0]}}
        "eq-1/100": {ladder: {hnsw_ef: [16, 24, 32], oversample: [1.0]}}
        "eq-10/10": {ladder: {hnsw_ef: [10], oversample: [1.0]}}
        "eq-10/100": {ladder: {hnsw_ef: [16, 24, 32], oversample: [1.0]}}
        "eq-10/1000": {ladder: {hnsw_ef: [128, 200, 256], oversample: [1.0]}}
        "none/10": {ladder: {hnsw_ef: [10, 16, 24, 40], oversample: [1.0]}}
        "none/100": {ladder: {hnsw_ef: [16, 24, 32, 48, 80], oversample: [1.0]}}
        "none/1000": {ladder: {hnsw_ef: [128, 200, 320], oversample: [1.0]}}
        "range-1/10": {ladder: {hnsw_ef: [10], oversample: [1.0]}}
