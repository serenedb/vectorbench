        "eq-0.1/100": *s100k_k100
        "range-10/100": *s100k_k100
        "range-1/100": *s100k_k100
        "and-1/100": *s100k_k100
        "corr/100": *s100k_k100
        "xcorr/100": *s100k_k100
        "eq-10/1000": *s100k_k1000
        "eq-1/1000": *s100k_k1000
        "eq-0.1/1000": *s100k_k1000
        "range-10/1000": *s100k_k1000
