        "range-10/100": *w10m_k100
        "range-1/100": *w10m_k100
        "and-1/100": *w10m_k100
        "corr/100": *w10m_k100
        "xcorr/100": *w10m_k100
        "eq-10/1000": *w10m_k1000
        "eq-1/1000": *w10m_k1000
        "eq-0.1/1000": *w10m_k1000
        "range-10/1000": *w10m_k1000
        "range-1/1000": *w10m_k1000
        "and-1/1000": *w10m_k1000
        "corr/1000": *w10m_k1000
        "xcorr/1000": *w10m_k1000
  sift-128:
