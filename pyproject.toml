[project]
name = "vectorbench"
version = "0.1.0"
description = "VectorBench: a ClickBench-style benchmark of vector search in databases"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=2.0",
  "pyarrow>=17",
  "pyyaml>=6",
  "orjson>=3.10",
  "requests>=2.32",
  "huggingface_hub>=0.30",
  "psycopg[binary]>=3.2",
  "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vectorbench = "vectorbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib"]
