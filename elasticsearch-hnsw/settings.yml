# Elasticsearch participant: Lucene's HNSW through the dense_vector field.
participant:
  name: Elasticsearch HNSW
  system: Elasticsearch
  family: hnsw
  tags: [Java, Lucene, Elasticsearch]

env:
  port: 9200
  container: vectorbench-elasticsearch-hnsw
  image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
  heap: 8g             # ES_JAVA_OPTS -Xms/-Xmx; the rest of RAM is Lucene's page cache
  index_name: items

connection:
  host: 127.0.0.1
  port: 9200
  index_name: items
  timeout: 600

# The query the driver checks once per group. Lucene names its kNN query in the profile output;
# a filtered query that silently fell back to a full scan would not carry it.
plan_rules:
  approximate: [Knn]
  exact_not: [Knn]

defaults:
  # Matched to the other HNSW participants: m 16, ef_construction 128, scalar 8-bit with reranking.
  # type: hnsw | int8_hnsw | int4_hnsw | bbq_hnsw (Lucene's quantized graph formats).
  index: {type: int8_hnsw, m: 16, ef_construction: 128, shards: 1, segments: 8}
  # num_candidates is Lucene's beam; it is floored at k, so the k=100 and k=1000 groups need their own.
  ladder: {num_candidates: [40, 64, 96, 128], oversample: [4.0]}
  groups:
    "*/100":  {ladder: {num_candidates: [400, 640], oversample: [4.0]}}
    "*/1000": {ladder: {num_candidates: [4000, 6000], oversample: [4.0]}}

